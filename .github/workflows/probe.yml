name: Probe Canada data
on:
  workflow_dispatch: {}
  push:
    branches: [canada-probe]
    paths: ["probe/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python probe/probe.py
      - run: |
          git config user.name "cpi-bot"; git config user.email "cpi-bot@users.noreply.github.com"
          git add probe/out && git commit -m "Probe output" && git push
