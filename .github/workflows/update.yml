name: Update CPI data

# Fetches each new BLS CPI release and FRED data (US) and Statistics Canada's CPI tables (Canada),
# rebuilds site/index.html and site/canada/index.html and commits them.
# Cloudflare Pages watches this repository and republishes inflationbreakdown.com on every commit.

on:
  schedule:
    # Every day at 13:45 UTC (after the 8:30 a.m. ET BLS release). Days with no new release change nothing.
    - cron: "45 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["template/**", "site.config.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml requests
      - name: Fetch latest BLS and FRED data
        # A run that finds no new release, or data that fails the checks, keeps the current data.
        # The reason shows as an annotation on the run's summary page.
        continue-on-error: true
        env:
          BLS_USER_AGENT: ${{ secrets.BLS_USER_AGENT }}
        run: python scripts/update_data.py
      - name: Fetch latest Statistics Canada data
        # Canada's CPI comes out about a week after the US one; days without a new release change nothing.
        continue-on-error: true
        run: python scripts/update_canada.py
      - name: Build the site
        run: python scripts/build_site.py
      - name: Save to the repository (Cloudflare Pages republishes from this)
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || (git commit -m "Update CPI data" && git push)
